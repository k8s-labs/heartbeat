apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: config
  namespace: config
  labels:
    app: config
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /config
            pathType: Prefix
            backend:
              service:
                name: config
                port:
                  number: 8080
