apiVersion: v1
kind: Pod
metadata:
  name: pos
  namespace: pos
  labels:
    app: pos
spec:
  containers:
  - name: app
    imagePullPolicy: IfNotPresent
    image: docker.io/library/pos:0.4.0
    args:
      - --log
    ports:
    - name: http
      containerPort: 8080
    livenessProbe:
      httpGet:
        path: /pos/healthz
        port: http
      initialDelaySeconds: 5
      failureThreshold: 10
      periodSeconds: 60
    startupProbe:
      httpGet:
        path: /pos/readyz
        port: http
      initialDelaySeconds: 5
      failureThreshold: 60
      periodSeconds: 2
    resources:
      limits:
        memory: 128Mi
        cpu: 200m
      requests:
        memory: 64Mi
        cpu: 100m
